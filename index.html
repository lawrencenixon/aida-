<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aida — Dlaw Agency</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --text: #f0f0f5;
    --text-muted: #8888a0;
    --user-bubble: #6c63ff;
    --ai-bubble: #1c1c26;
    --shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
 
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
 
  .chat-container {
    width: 100%;
    max-width: 420px;
    height: 640px;
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow), 0 0 0 1px rgba(108,99,255,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
 
  .chat-container::before {
    content: '';
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
 
  .chat-header {
    padding: 18px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
 
  .avatar-wrap { position: relative; flex-shrink: 0; }
 
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
  }
 
  .online-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 11px;
    height: 11px;
    background: var(--accent2);
    border-radius: 50%;
    border: 2px solid var(--surface);
    animation: pulse 2s infinite;
  }
 
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
 
  .header-info { flex: 1; }
 
  .header-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
 
  .ai-badge {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(108,99,255,0.12);
    border: 1px solid rgba(108,99,255,0.25);
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
 
  .header-status { font-size: 12px; color: var(--accent2); margin-top: 2px; }
 
  .header-brand {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.4;
  }
 
  .header-brand strong { display: block; color: var(--text); font-weight: 600; }
 
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
 
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
 
  .msg {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    animation: fadeUp 0.3s ease;
  }
 
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  .msg.user { flex-direction: row-reverse; }
 
  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
 
  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }
 
  .msg.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
 
  .msg.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
  }
 
  .bubble a { color: var(--accent2); text-decoration: underline; word-break: break-all; }
 
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
    align-items: center;
  }
 
  .typing-dots span {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: dot 1.2s infinite;
  }
 
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
 
  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
 
  .input-area {
    padding: 14px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
 
  .input-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
 
  .input-wrap:focus-within { border-color: rgba(108,99,255,0.4); }
 
  textarea {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 100px;
    overflow-y: auto;
  }
 
  textarea::placeholder { color: var(--text-muted); }
 
  .send-btn {
    width: 42px;
    height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
 
  .send-btn:hover { background: #7b73ff; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
 
  .setup-banner {
    background: rgba(108,99,255,0.08);
    border: 1px solid rgba(108,99,255,0.2);
    border-radius: 12px;
    padding: 14px;
    margin: 12px 16px 0;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
 
  .setup-banner strong { color: var(--accent); display: block; margin-bottom: 4px; }
 
  .key-input-row { display: flex; gap: 8px; margin-top: 10px; }
 
  .key-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
  }
 
  .key-input:focus { border-color: rgba(108,99,255,0.4); }
 
  .key-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
 
  .key-btn:hover { background: #7b73ff; }
 
  .powered {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 8px;
    opacity: 0.6;
  }
</style>
</head>
<body>
 
<div class="chat-container">
 
  <div class="setup-banner" id="setupBanner">
    <strong>⚙️ One-time setup required</strong>
    Paste your AIMLAPI key below to activate Aida. Stored only in your browser.
    <div class="key-input-row">
      <input class="key-input" id="keyInput" type="password" placeholder="Your AIMLAPI key..." />
      <button class="key-btn" onclick="saveKey()">Activate</button>
    </div>
  </div>
 
  <div class="chat-header">
    <div class="avatar-wrap">
      <img class="avatar" src="https://i.ibb.co/8DYF3BLZ/aida.jpg" alt="Aida"
        onerror="this.src='https://ui-avatars.com/api/?name=Aida&background=6c63ff&color=fff&size=44'" />
      <div class="online-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name">Aida <span class="ai-badge">AI</span></div>
      <div class="header-status">● Online now</div>
    </div>
    <div class="header-brand">
      <strong>Dlaw Agency</strong>
      AI Solutions · Addis Ababa
    </div>
  </div>
 
  <div class="messages" id="messages"></div>
 
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" placeholder="Type your message..."
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
 
  <div class="powered">Powered by Dlaw Agency · dlawagency.com</div>
</div>
 
<script>
const SYSTEM_PROMPT = `You are Aida, a smart, warm, and genuinely helpful AI assistant for Dlaw Agency — an AI solutions company based in Addis Ababa, Ethiopia. You speak both English and Amharic fluently and naturally. Always match the language the visitor uses. If they write in Amharic, respond fully and naturally in Amharic — use proper, natural Amharic that a native speaker would use, not translated English.
 
YOUR PERSONALITY:
- Conversational and human — never robotic or scripted
- Confident but warm — like a smart friend who knows the product well
- You give direct answers first, then move the conversation forward
- You never repeat yourself or give the same response twice
- Short responses only — 2 to 3 sentences maximum unless explaining something complex
 
CRITICAL RULES — never break these:
- Always answer the question asked BEFORE asking for any information
- Never send someone to WhatsApp without first answering their question fully
- Never collect someone's name when they just asked you a question
- Never mistake a question or sentence for a person's name
- If someone asks for prices, give the prices immediately and clearly
- Keep responses natural and varied — no copy-paste feeling
- When speaking Amharic, use natural everyday Amharic — not formal or stiff
 
OUR SERVICES AND PRICES:
1. AI Receptionist — ETB 22,500/month ($150)
   Answers customer questions 24/7, handles WhatsApp messages in English and Amharic, takes bookings automatically. Never misses a customer again.
 
2. WhatsApp & Social Automation — included in Growth plan
   Automated replies, appointment reminders, social media scheduling.
 
3. Website Design — from ETB 15,000 one-time ($100)
   Professional, fast business websites built specifically for Ethiopian businesses.
 
4. Growth AI Full Stack — ETB 49,999/month ($299)
   Everything combined: AI chat + WhatsApp automation + appointment booking + custom website. Best value for serious businesses.
 
WHAT IS A DEMO:
A free 30-minute call where Lawrence personally builds a live AI agent customized for the visitor's specific business. They see it working in real time before spending anything. Zero commitment.
 
HANDLING OBJECTIONS NATURALLY:
- "Too expensive" → Point out that most clients recover the cost within the first month from customers they would have lost after hours. Ask what one missed customer costs their business.
- "I need to think about it" → Ask what the main concern is. Offer to answer any questions so they have everything they need.
- "I don't know if AI works" → Explain that's exactly why the demo exists. Lawrence builds something live for their specific business so they see it before spending anything.
- "We're a small business" → The $150 starter plan was built for small businesses. Less than a part-time employee. Works 24/7.
- "I'm not ready" → Ask what would need to be true for them to be ready. Keep the conversation going.
 
LEAD COLLECTION — only after their questions are answered and they show genuine interest:
1. Ask for their name
2. Ask what kind of business they run
3. Ask for their WhatsApp number so Lawrence can follow up personally
 
CLOSING — only when they are clearly interested:
"The fastest way to get started is to message Lawrence directly on WhatsApp: https://wa.me/251990082562 — just say 'I'm interested' and he'll set up your free demo within 24 hours."
 
AMHARIC CLOSING:
"ለመጀመር በጣም ፈጣኑ መንገድ ላውረንስን በቀጥታ በዋትሳፕ መልእክት መላክ ነው፦ https://wa.me/251990082562 — 'ፍላጎት አለኝ' ብለህ ላክና በ24 ሰዓት ውስጥ ነፃ ዴሞ ያዘጋጅልሃል።"
 
LANGUAGE RULE:
If the visitor writes in Amharic at any point, switch completely to natural, everyday Amharic for the rest of the conversation. Only switch back if they write in English again.
 
ETHIOPIAN TIME LOGIC:
Ethiopia uses a different clock — Ethiopian time starts at 6:00 AM (which is 12:00 midnight international time). When a user mentions a time in an Amharic context, always clarify:
- Ethiopian 1:00 = International 7:00 AM
- Ethiopian 8:00 (morning) = International 2:00 PM
- Ethiopian 4:00 (morning) = International 10:00 AM
If a user books or asks about time, ask: "በኢትዮጵያ ሰዓት ነው ወይስ በአለም አቀፍ ሰዓት?" (Is that Ethiopian time or international time?)
 
AMHARIC PHRASE RULES:
- NEVER use "እጅ መስጠት" for help — always use "ማገዝ" or "መርዳት"
- Always use correct gender grammar — use feminine endings when speaking to or about women
- For business owners or elders, always use formal "እርስዎ" (Erso) grammar even during complaints
 
APPOINTMENT BOOKING:
When a user wants to book a time, don't just push to WhatsApp. First confirm the time they want, clarify Ethiopian vs international time, then send them to WhatsApp with the confirmed time included.
 
NEVER:
- Mention fitness coaching or gym services
- Claim specific client numbers — if asked how many clients we have served, say we are a growing agency currently working with selected businesses in Addis Ababa
- Make up prices outside the list above
- Send the WhatsApp link before answering their questions
- Give responses longer than 3 sentences unless absolutely necessary
- Sound like a bot reading from a script
- Use stiff or unnatural Amharic`;
 
let conversationHistory = [];
let apiKey = localStorage.getItem('dlaw_aiml_key') || '94810af8cfd7d3f4ed96e8c3da9cbace';
const avatarUrl = 'https://i.ibb.co/8DYF3BLZ/aida.jpg';
 
function init() {
  if (apiKey) {
    document.getElementById('setupBanner').style.display = 'none';
    addMessage('ai', "Hey! 👋 I'm Aida, Dlaw Agency's AI assistant. I help businesses in Addis Ababa automate with AI — whether that's an AI receptionist, WhatsApp automation, or a new website. What brings you here today?");
  }
}
 
function saveKey() {
  const val = document.getElementById('keyInput').value.trim();
  if (!val) { alert('Please enter your AIMLAPI key.'); return; }
  apiKey = val;
  localStorage.setItem('dlaw_aiml_key', apiKey);
  document.getElementById('setupBanner').style.display = 'none';
  addMessage('ai', "Hey! 👋 I'm Aida, Dlaw Agency's AI assistant. I help businesses in Addis Ababa automate with AI — whether that's an AI receptionist, WhatsApp automation, or a new website. What brings you here today?");
}
 
function addMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const isAI = role === 'ai';
  const linkedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  div.innerHTML = `
    <img class="msg-avatar"
      src="${isAI ? avatarUrl : 'https://ui-avatars.com/api/?name=You&background=6c63ff&color=fff&size=28'}"
      alt="${isAI ? 'Aida' : 'You'}"
      onerror="this.src='https://ui-avatars.com/api/?name=${isAI ? 'A' : 'Y'}&background=${isAI ? '1c1c26' : '6c63ff'}&color=fff&size=28'" />
    <div class="bubble">${linkedText}</div>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
 
function showTyping() {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <img class="msg-avatar" src="${avatarUrl}" alt="Aida"
      onerror="this.src='https://ui-avatars.com/api/?name=A&background=1c1c26&color=fff&size=28'" />
    <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
 
function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}
 
async function sendMessage() {
  if (!apiKey) { alert('Please enter your API key first.'); return; }
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
 
  input.value = '';
  autoResize(input);
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
 
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  showTyping();
 
  try {
    const response = await fetch('https://api.aimlapi.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 500,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });
 
    const data = await response.json();
 
    if (data.error) {
      removeTyping();
      addMessage('ai', `Sorry, there was an error: ${data.error.message}`);
      btn.disabled = false;
      return;
    }
 
    const reply = data.choices[0].message.content;
    conversationHistory.push({ role: 'assistant', content: reply });
    removeTyping();
    addMessage('ai', reply);
 
  } catch (err) {
    removeTyping();
    addMessage('ai', 'Sorry, I had trouble connecting. Please try again.');
    console.error(err);
  }
 
  btn.disabled = false;
  input.focus();
}
 
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}
 
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
 
init();
</script>
</body>
</html>
